name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: observability_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d observability_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Initialize test database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d observability_test -f db/schema.sql
          

      - name: Run tests
        run: |
          python -m pytest -v
      
      - name: Build Docker image
        run: |
          docker build -t infra-observability-platform-api .